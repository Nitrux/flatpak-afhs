name: Build and push packages to PackageCloud.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version tag to package, or 'latest' for the newest stable release"
        required: true
        default: latest
        type: string
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies.
        run: |
          sudo gem install package_cloud

      - name: Build.
        run: |
          sudo ./gh-build.sh "${{ inputs.version || 'latest' }}"

      - name: Push package.
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: |
          package_cloud push nitrux/testing/debian/duke $(pwd)/*.deb
